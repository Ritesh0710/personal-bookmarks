<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritesh — Tech Resource Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0e;
    --bg2: #131316;
    --bg3: #1a1a1f;
    --bg4: #222228;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0efe8;
    --muted: #888880;
    --faint: #444440;
    --accent: #c8f064;
    --accent2: #64c8f0;
    --accent3: #f064a0;
    --accent4: #f0a064;
    --accent5: #a064f0;
    --r: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* --- GRID BG --- */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  .glow-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  .orb1 { width: 600px; height: 600px; background: rgba(200,240,100,0.04); top: -200px; right: -100px; }
  .orb2 { width: 400px; height: 400px; background: rgba(100,200,240,0.04); bottom: 10%; left: -100px; }

  /* --- LAYOUT --- */
  .shell { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 0 24px; }

  /* --- HEADER --- */
  header {
    padding: 48px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .logo-area {}

  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .eyebrow::before {
    content: '';
    width: 20px;
    height: 1px;
    background: var(--accent);
    display: inline-block;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
    color: var(--text);
  }

  h1 em {
    font-style: italic;
    font-family: 'Instrument Serif', serif;
    color: var(--accent);
    font-size: 1.1em;
  }

  .header-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .stat-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--border2);
    border-radius: 20px;
    font-size: 12px;
    color: var(--muted);
    background: var(--bg2);
  }

  .stat-pill strong { color: var(--text); font-weight: 500; }

  /* --- CONTROLS --- */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 240px;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    width: 16px;
    height: 16px;
  }

  #search {
    width: 100%;
    padding: 12px 14px 12px 40px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--r);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  #search:focus { border-color: var(--border2); }
  #search::placeholder { color: var(--faint); }

  .view-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: var(--r);
    overflow: hidden;
  }

  .view-btn {
    padding: 10px 14px;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .view-btn.active {
    background: var(--bg3);
    color: var(--text);
  }

  /* --- CATEGORY TABS --- */
  .cat-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  .cat-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .cat-btn:hover { border-color: var(--border2); color: var(--text); }

  .cat-btn.active {
    color: #0c0c0e;
    border-color: transparent;
    font-weight: 500;
  }

  /* --- SECTION HEADER --- */
  .section-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    margin-top: 40px;
  }

  .section-head:first-child { margin-top: 0; }

  .section-label {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .section-count {
    font-size: 11px;
    color: var(--faint);
  }

  /* --- TECH CARDS GRID --- */
  .tech-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }

  /* LIST VIEW */
  .list-view .tech-grid {
    grid-template-columns: 1fr;
  }

  /* --- TECH CARD --- */
  .tech-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--r);
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
  }

  .tech-card:hover {
    border-color: var(--border2);
    transform: translateY(-1px);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }

  .card-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .card-name {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
  }

  .card-count {
    font-size: 10px;
    color: var(--faint);
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 20px;
  }

  .chevron {
    color: var(--faint);
    font-size: 10px;
    transition: transform 0.25s;
    flex-shrink: 0;
  }

  .tech-card.open .chevron { transform: rotate(180deg); }

  /* --- RESOURCES --- */
  .card-resources {
    display: none;
    border-top: 1px solid var(--border);
    padding: 8px 0;
  }

  .tech-card.open .card-resources { display: block; }

  .res-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 16px;
    transition: background 0.1s;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }

  .res-item:hover { background: var(--bg3); }

  .res-num {
    font-size: 10px;
    color: var(--faint);
    min-width: 16px;
    padding-top: 2px;
    font-weight: 400;
  }

  .res-body { flex: 1; }

  .res-title {
    font-size: 13px;
    color: var(--accent2);
    font-weight: 400;
    margin-bottom: 3px;
    line-height: 1.4;
  }

  .res-item:hover .res-title { text-decoration: underline; }

  .res-meta {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .res-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    flex: 1;
  }

  .res-badge {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    flex-shrink: 0;
    font-weight: 500;
  }

  .badge-book   { background: rgba(100,240,100,0.12); color: #64f0a0; }
  .badge-course { background: rgba(100,200,240,0.12); color: #64c8f0; }
  .badge-site   { background: rgba(240,160,100,0.12); color: #f0a064; }
  .badge-yt     { background: rgba(240,80,80,0.12);   color: #f06060; }
  .badge-docs   { background: rgba(160,100,240,0.12); color: #a064f0; }

  /* --- EMPTY --- */
  .empty-state {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--faint);
    font-size: 13px;
  }

  .empty-state span {
    display: block;
    font-size: 32px;
    margin-bottom: 12px;
  }

  /* --- PROGRESS BAR (target tracker) --- */
  .target-bar {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 20px 24px;
    margin-bottom: 32px;
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
  }

  .target-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }

  .target-value {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
  }

  .track-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
  }

  .track-pill {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 11px;
    letter-spacing: 0.04em;
    border: 1px solid;
    cursor: default;
  }

  .tp-de   { border-color: rgba(200,240,100,0.3); color: var(--accent);  background: rgba(200,240,100,0.07); }
  .tp-mle  { border-color: rgba(100,200,240,0.3); color: var(--accent2); background: rgba(100,200,240,0.07); }
  .tp-genai{ border-color: rgba(240,100,160,0.3); color: var(--accent3); background: rgba(240,100,160,0.07); }

  /* --- FOOTER --- */
  footer {
    margin-top: 80px;
    padding: 32px 0 40px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: gap;
    gap: 16px;
  }

  footer span {
    font-size: 11px;
    color: var(--faint);
  }

  .result-info {
    font-size: 11px;
    color: var(--faint);
    margin-bottom: 20px;
  }

  /* scroll to top */
  #totop {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s;
  }
  #totop.show { opacity: 1; transform: translateY(0); }
  #totop:hover { background: var(--bg4); }

  @media (max-width: 640px) {
    .header-meta { align-items: flex-start; }
    .tech-grid { grid-template-columns: 1fr; }
  }

  /* animate cards on load */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .tech-card { animation: fadeUp 0.3s ease both; }
</style>
</head>

<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>

<div class="shell">

  <!-- HEADER -->
  <header>

      <div class="logo-area">

  <!-- TARGET BAR -->
  <div class="target-bar">

  <!-- CONTROLS -->
  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        List
      </button>
    </div>
  </div>

  <!-- CATEGORY BAR -->
  <div class="cat-bar" id="catBar"></div>

  <!-- RESULT INFO -->
  <div class="result-info" id="resultInfo"></div>

  <!-- MAIN CONTENT -->
  <div id="main"></div>

  <!-- FOOTER -->
  <footer>
    <span>Ritesh Zambre · Tech Resource Hub · Updated May 2026</span>
    <span>60 technologies · 300 resources</span>
  </footer>

</div>

let activeCat = "All";
let viewMode = "grid";
let openCards = new Set();

function catColor(cat){ return (CATS[cat]||{color:"#888"}).color; }

function badgeClass(type){
  return { book:"badge-book", course:"badge-course", site:"badge-site", yt:"badge-yt", docs:"badge-docs" }[type] || "badge-docs";
}

function setTrack(label, el){
  document.getElementById("trackDisplay").textContent = label;
  document.querySelectorAll(".track-pill").forEach(p=>p.style.opacity="0.5");
  el.style.opacity="1";
}

function setView(v){
  viewMode = v;
  document.getElementById("vgrid").classList.toggle("active", v==="grid");
  document.getElementById("vlist").classList.toggle("active", v==="list");
  document.getElementById("main").className = v==="list" ? "list-view" : "";
  render();
}

function toggle(name){
  if(openCards.has(name)) openCards.delete(name);
  else openCards.add(name);
  render();
}

function render(){
  const q = document.getElementById("search").value.toLowerCase().trim();
  const catBar = document.getElementById("catBar");
  const allCats = ["All",...Object.keys(CATS)];

  catBar.innerHTML = allCats.map(c=>{
    const col = CATS[c]?.color || "#888";
    const isActive = activeCat===c;
    return `<button class="cat-btn${isActive?" active":""}"
      style="${isActive?`background:${col};color:#0c0c0e;border-color:${col};`:""}"
      onclick="activeCat='${c}';render()">${c}</button>`;
  }).join("");

  let filtered = DATA.filter(t=>{
    const cm = activeCat==="All" || t.cat===activeCat;
    const qm = !q || t.name.toLowerCase().includes(q)
      || t.cat.toLowerCase().includes(q)
      || t.resources.some(r=>r.title.toLowerCase().includes(q)||r.desc.toLowerCase().includes(q));
    return cm && qm;
  });

  document.getElementById("resultInfo").textContent =
    `Showing ${filtered.length} of ${DATA.length} technologies · ${filtered.length*5} resources`;

  const byCat = {};
  filtered.forEach(t=>{ if(!byCat[t.cat]) byCat[t.cat]=[]; byCat[t.cat].push(t); });

  if(!filtered.length){
    document.getElementById("main").innerHTML =
      `<div class="empty-state"><span>🔍</span>No results for "${q}"</div>`;
    return;
  }

  const html = Object.entries(byCat).map(([cat,techs])=>{
    const col = catColor(cat);
    const cards = techs.map((t,idx)=>{
      const isOpen = openCards.has(t.name) || !!q;
      const resHTML = t.resources.map((r,i)=>`
        <a class="res-item" href="${r.url}" target="_blank" rel="noopener">
          <span class="res-num">${i+1}</span>
          <div class="res-body">
            <div class="res-title">${r.title}</div>
            <div class="res-meta">
              <span class="res-desc">${r.desc}</span>
              <span class="res-badge ${badgeClass(r.type)}">${r.type}</span>
            </div>
          </div>
        </a>`).join("");
      return `<div class="tech-card${isOpen?" open":""}" style="animation-delay:${idx*30}ms">
        <div class="card-header" onclick="toggle('${t.name.replace(/'/g,"\\'")}')">
          <div class="card-dot" style="background:${col}"></div>
          <span class="card-name">${t.name}</span>
          <span class="card-count">5 resources</span>
          <span class="chevron${isOpen?" open":""}">▼</span>
        </div>
        <div class="card-resources">${resHTML}</div>
      </div>`;
    }).join("");

    return `<div class="section-head">
        <span class="section-label" style="color:${col}">${cat}</span>
        <div class="section-line"></div>
        <span class="section-count">${techs.length} tech</span>
      </div>
      <div class="tech-grid">${cards}</div>`;
  }).join("");

  document.getElementById("main").innerHTML = html;
  if(viewMode==="list") document.getElementById("main").classList.add("list-view");
}

// Scroll to top button
window.addEventListener("scroll",()=>{
  document.getElementById("totop").classList.toggle("show", window.scrollY > 400);
});

render();
</script>
