<title>Tech Resource Hub v2</title>
<style>
  :root {
    color-scheme: light dark;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --border-radius-md: 8px;
    --border-radius-lg: 12px;
    --color-background-primary: #ffffff;
    --color-background-secondary: #f6f7f9;
    --color-background-info: #eef4ff;
    --color-border-secondary: #e3e6ea;
    --color-border-tertiary: #eef0f3;
    --color-border-info: #c7dbff;
    --color-text-primary: #16181d;
    --color-text-secondary: #5b6270;
    --color-text-tertiary: #8b93a1;
    --color-text-info: #1a4fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-background-primary: #0f1115;
      --color-background-secondary: #171a20;
      --color-background-info: #14243f;
      --color-border-secondary: #262b34;
      --color-border-tertiary: #1e222a;
      --color-border-info: #2b4a7d;
      --color-text-primary: #e9ecf1;
      --color-text-secondary: #a1a9b8;
      --color-text-tertiary: #737c8c;
      --color-text-info: #7aa9ff;
    }
  }
  html { background: var(--color-background-primary); }
  body {
    font-family: var(--font-sans);
    color: var(--color-text-primary);
    background: var(--color-background-primary);
    margin: 0 auto;
    padding: 28px 20px 64px;
    max-width: 1100px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .unused-back {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--color-text-secondary);
    text-decoration: none; margin-bottom: 20px;
    padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--color-border-secondary);
  }
  .back:hover { color: var(--color-text-primary); background: var(--color-background-secondary); }
  table { border-collapse: collapse; }
  img { max-width: 100%; }
</style>
</head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.wrap{padding:1rem 0}
.search-row{display:flex;gap:8px;margin-bottom:1rem;align-items:center}
.search-row input{flex:1;padding:8px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:14px;background:var(--color-background-primary);color:var(--color-text-primary)}
.cat-scroll{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem}
.cat-btn{padding:4px 12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);font-size:12px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary);transition:all 0.15s}
.cat-btn.active{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
.stats{font-size:12px;color:var(--color-text-tertiary);margin-bottom:1rem}
.section{margin-bottom:1.5rem}
.section-title{font-size:11px;font-weight:500;color:var(--color-text-tertiary);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:0.5rem;padding:0 2px}
.tech-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:8px;overflow:hidden}
.tech-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
.tech-header:hover{background:var(--color-background-secondary)}
.tech-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tech-name{font-size:14px;font-weight:500;color:var(--color-text-primary);flex:1}
.tech-cat{font-size:11px;color:var(--color-text-tertiary);padding:2px 8px;border-radius:10px;border:0.5px solid var(--color-border-tertiary)}
.chevron{font-size:12px;color:var(--color-text-tertiary);transition:transform 0.2s}
.chevron.open{transform:rotate(180deg)}
.resources{padding:0 14px 12px;display:none}
.resources.open{display:block}
.res-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-top:0.5px solid var(--color-border-tertiary)}
.res-num{font-size:11px;font-weight:500;color:var(--color-text-tertiary);min-width:16px;margin-top:2px}
.res-content{flex:1}
.res-title{font-size:13px;font-weight:500;color:var(--color-text-info);cursor:pointer;text-decoration:none}
.res-title:hover{text-decoration:underline}
.res-type{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle}
.type-book{background:#EAF3DE;color:#3B6D11}
.type-course{background:#E6F1FB;color:#185FA5}
.type-site{background:#FAEEDA;color:#854F0B}
.type-yt{background:#FCEBEB;color:#A32D2D}
.type-docs{background:#EEEDFE;color:#534AB7}
.res-desc{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.empty{text-align:center;padding:2rem;color:var(--color-text-tertiary);font-size:14px}
</style>

    {title:"Streamlit Official Docs",url:"https://docs.streamlit.io",type:"docs",desc:"Full reference — components, layout, state, caching, deployment"},
    {title:"Streamlit Gallery",url:"https://streamlit.io/gallery",type:"site",desc:"Real app examples — study code, replicate patterns for interviews"},
    {title:"30 Days of Streamlit",url:"https://30days.streamlit.app",type:"course",desc:"Free interactive course — daily challenges covering all components"},
    {title:"Data Professor YouTube",url:"https://www.youtube.com/@DataProfessor",type:"yt",desc:"Best Streamlit tutorial channel — ML app demos from scratch"},
    {title:"Building Data Apps with Streamlit (Packt)",url:"https://www.packtpub.com/en-us/product/building-data-science-applications-with-fastapi-9781803258751",type:"book",desc:"Practical Streamlit + FastAPI book for ML app deployment"}
  ]},
  {name:"Designing ML Systems",cat:"ML & Data Science",resources:[
    {title:"Designing ML Systems (Chip Huyen)",url:"https://www.oreilly.com/library/view/designing-machine-learning/9781098107956/",type:"book",desc:"THE most interview-relevant ML book — read this cover to cover"},
    {title:"Chip Huyen Blog",url:"https://huyenchip.com/blog",type:"site",desc:"Companion blog — real ML system design, production patterns"},
    {title:"Full Stack Deep Learning",url:"https://fullstackdeeplearning.com",type:"course",desc:"Free — end-to-end ML system design and deployment"},
    {title:"Made With ML",url:"https://madewithml.com",type:"site",desc:"Free MLOps curriculum — design patterns and production ML"},
    {title:"ML System Design Interview (Alex Xu)",url:"https://www.amazon.com/Machine-Learning-System-Design-Interview/dp/1736049127",type:"book",desc:"Interview-focused ML system design — great for 40LPA level prep"}
  ]},
];

let activecat = "All";
let openCards = new Set();

function getCatColor(cat){return cats[cat]||"#888"}

const allCats = ["All",...Object.keys(cats)];

function render(){
  const q = document.getElementById("searchInput").value.toLowerCase();
  const catRow = document.getElementById("catRow");
  catRow.innerHTML = allCats.map(c=>`<button class="cat-btn${activecat===c?" active":""}" onclick="setcat('${c}')">${c}</button>`).join("");

  let filtered = data.filter(t=>{
    const catMatch = activecat==="All"||t.cat===activecat;
    const qMatch = !q || t.name.toLowerCase().includes(q)||t.cat.toLowerCase().includes(q)||t.resources.some(r=>r.title.toLowerCase().includes(q)||r.desc.toLowerCase().includes(q));
    return catMatch && qMatch;
  });

  document.getElementById("stats").textContent = `${filtered.length} of ${data.length} technologies`;

  const byCat = {};
  filtered.forEach(t=>{
    if(!byCat[t.cat]) byCat[t.cat]=[];
    byCat[t.cat].push(t);
  });

  const content = document.getElementById("content");
  if(filtered.length===0){content.innerHTML='<div class="empty">No technologies match your search</div>';return;}

  content.innerHTML = Object.entries(byCat).map(([cat,techs])=>`
    <div class="section">
      <div class="section-title" style="color:${getCatColor(cat)}">${cat}</div>
      ${techs.map(t=>{
        const isOpen = openCards.has(t.name)||!!q;
        return `<div class="tech-card">
          <div class="tech-header" onclick="toggle('${t.name}')">
            <div class="tech-dot" style="background:${getCatColor(t.cat)}"></div>
            <span class="tech-name">${t.name}</span>
            <span class="tech-cat">${t.cat}</span>
            <i class="ti ti-chevron-down chevron${isOpen?" open":""}"></i>
          </div>
          <div class="resources${isOpen?" open":""}">
            ${t.resources.map((r,i)=>`
              <div class="res-item">
                <span class="res-num">${i+1}</span>
                <div class="res-content">
                  <div><a class="res-title" href="${r.url}" target="_blank">${r.title}</a><span class="res-type type-${r.type}">${r.type}</span></div>
                  <div class="res-desc">${r.desc}</div>
                </div>
              </div>`).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>`).join("");
}

function setcat(c){activecat=c;render();}
function toggle(name){
  if(openCards.has(name)) openCards.delete(name);
  else openCards.add(name);
  render();
}

render();
</script>
